[project]
name = "wayshade"
version = "0.1.0"
description = "A Python-controlled shader wallpaper renderer for Linux/Wayland"
readme = "README.md"
authors = [
    { name = "Josh Wilson", email = "joshwilsonvu@gmail.com" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "pyopengl>=3.1.10",
    "pywayland>=0.4.18",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
exclude = ["src/wayshade/_protocol"]
